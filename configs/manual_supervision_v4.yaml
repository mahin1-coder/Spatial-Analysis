data:
  raster_dir: data_research_final
  shapefile_dir: data/reference/noaa_dat_all
  manual_label_dir: data/manual_labels/screenshot_verified
  output_dir: outputs_manual_v4

analysis:
  max_dimension: 1600
  clusters: 6
  candidate_percentile: 86
  min_area_fraction: 0.00005
  random_seed: 42

model:
  candidates: [extra_trees, random_forest]
  validation_folds: 4
  probability_percentiles: [82, 86, 90, 94]
  positive_samples_per_case: 1800
  negative_samples_per_case: 3600

postprocessing:
  max_paths: 6
  max_gap_pixels: 55
  mndwi_threshold: 0.05
  minimum_water_fraction_for_bridge: 0.25
  maximum_bridge_angle_degrees: 45
  minimum_relative_path_score: 0.18
  water_exclusion_buffer_pixels: 5
  maximum_feature_follow_fraction: 0.55

context_layers:
  hydrography_paths: []
  road_paths: []
  railway_paths: []
  hydrography_buffer_pixels: 2.0
  road_buffer_pixels: 1.5
  railway_buffer_pixels: 1.5
